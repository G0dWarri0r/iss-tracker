<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISS Live Tracker</title>
    <link rel="icon" href="satellite.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="max-w-5xl mx-auto p-4">
        <header class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-bold">🛰️ ISS Live Tracker</h1>
            <span id="status" class="text-sm px-3 py-1 rounded-full bg-slate-800 text-slate-300">
                Connecting...
            </span>
        </header>

        <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
            <div class="bg-slate-900 rounded-xl p-4">
                <p class="text-xs uppercase text-slate-400">Latitude</p>
                <p id="lat" class="text-xl font-semibold">--</p>
            </div>
            <div class="bg-slate-900 rounded-xl p-4">
                <p class="text-xs uppercase text-slate-400">Longitude</p>
                <p id="lon" class="text-xl font-semibold">--</p>
            </div>
            <div class="bg-slate-900 rounded-xl p-4">
                <p class="text-xs uppercase text-slate-400">Altitude</p>
                <p id="alt" class="text-xl font-semibold">--</p>
            </div>
            <div class="bg-slate-900 rounded-xl p-4">
                <p class="text-xs uppercase text-slate-400">Speed</p>
                <p id="speed" class="text-xl font-semibold">--</p>
            </div>
        </section>
        <article class="flex justify-between items-center">
            <p class="mb-3 text-slate-300">
                Currently over: <span id="place" class="font-semibold text-white text-sm">--</span>
            </p>
            <div class="flex gap-3">
                <label class="text-slate-400 uppercase text-xs" for="track">Follow ISS</label>
                <input id="track" name="track" type="checkbox" />
            </div>
        </article>
        <div id="map" style="height: 450px;" class="rounded-xl"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="script.js"></script>
</body>

</html>
